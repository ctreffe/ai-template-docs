project:
  type: website
  output-dir: output/html
  render:
    - /docs/**/*.qmd
    - "!/docs/**/DOCUMENT_CONTEXT.md"
  # Internal contexts and research materials must not be linked/included as
  # publication resources; render exclusions do not prevent resource copying.

website:
  title: "TBD Documentation"
  navbar:
    left:
      - href: docs/index.qmd
        text: English
      - href: docs/index.de.qmd
        text: Deutsch

format:
  html:
    embed-resources: true
    toc: true
    number-sections: true
    theme: cosmo

